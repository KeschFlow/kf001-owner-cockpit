name: Apply revenue Gmail-read fallback

on:
  push:
    branches: [fix/revenue-without-gmail-read]
    paths:
      - 'backend/scripts/apply-revenue-without-gmail-read.mjs'
      - '.github/workflows/apply-revenue-without-gmail-read.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenue-without-gmail-read
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: node backend/scripts/apply-revenue-without-gmail-read.mjs
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run check
      - working-directory: backend
        run: npm test
      - name: Commit patched production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/revenue-autopilot.js backend/test/revenue-autopilot.test.mjs
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "Keep checkout revenue live without Gmail read scope"
          git push origin HEAD:fix/revenue-without-gmail-read
