<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KF001 Fallradar">
  <title>KF001 Fallradar</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./app-icon.svg" sizes="any" type="image/svg+xml">
  <style>
    html,body{margin:0;min-height:100%;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;min-height:100dvh}
    #bootFallback{box-sizing:border-box;max-width:768px;margin:0 auto;padding:24px 16px;display:flex;min-height:100dvh;align-items:flex-start}
    #bootCard{width:100%;margin-top:8px;border:1px solid #1e293b;background:#020617;border-radius:18px;padding:18px;box-sizing:border-box}
    #bootLabel{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:#64748b}
    #bootTitle{font-size:22px;font-weight:900;margin:6px 0 18px}
    #bootState{font-size:14px;font-weight:700;color:#fbbf24}
    button{font:inherit}
  </style>
  <script>
    (() => {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      const ticket = params.get('owner-enroll');
      if (ticket && /^[A-Za-z0-9_-]{43,128}$/.test(ticket)) {
        window.KF001_BOOTSTRAP_STATE = { enrollmentTicket: ticket };
        history.replaceState(null, '', `${location.pathname}${location.search}`);
      }
    })();
  </script>
  <script src="./governance-config.js?v=1.7.0"></script>
  <script defer src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="bootFallback">
    <div id="bootCard">
      <div id="bootLabel">KF001</div>
      <div id="bootTitle">FALLRADAR</div>
      <div id="bootState">Oberfläche wird gestartet …</div>
    </div>
  </div>

  <main id="legacyRuntime" style="display:none">
    <section id="ownerGateContainer"></section>
  </main>

  <script src="./owner-auth.js?v=1.6.2"></script>
  <script src="./adapters.js?v=1.4.6"></script>
  <!-- Cockpit shell starts before optional radar/governance modules. -->
  <script src="./slim-owner-ui.js?v=1.2.2"></script>
  <script src="./radar-ui.js?v=1.2.0"></script>
  <script src="./truth-ui-fix.js?v=1.1.0"></script>
  <script src="./governance.js?v=1.5.3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const fallback = document.getElementById('bootFallback');
      const reveal = () => {
        const shell = document.getElementById('kfSlimOwner');
        if (!shell) return false;
        if (fallback) fallback.remove();
        return true;
      };
      if (!reveal()) {
        const observer = new MutationObserver(() => {
          if (reveal()) observer.disconnect();
        });
        observer.observe(document.body, { childList:true, subtree:true });
        setTimeout(() => {
          if (!reveal()) {
            observer.disconnect();
            const state = document.getElementById('bootState');
            if (state) state.textContent = 'UI konnte nicht gestartet werden. Seite neu laden.';
          }
        }, 4000);
      }
    }, { once:true });

    if ('serviceWorker' in navigator) {
      addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js?v=14');
          await reg.update();
        } catch (_) {}
      }, { once:true });
    }
  </script>
</body>
</html>
