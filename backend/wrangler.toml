name = "kf001-owner-backend"
main = "src/worker-v3.js"
compatibility_date = "2026-08-17"
workers_dev = true

[vars]
PUBLIC_APP_ORIGIN = "https://keschflow.github.io"
REVENUE_AUTOPILOT_ENABLED = "true"
AUTOPILOT_MIN_ECONOMIC_SCORE = "72"
AUTOPILOT_MIN_VALUE_USD = "8000"
AUTOPILOT_MAX_NEW_OUTREACH_PER_DAY = "1"
SUCCESS_FEE_EUR = "750"

[secrets]
required = [
  "OWNER_BOOTSTRAP_TOKEN",
  "RADAR_INGEST_TOKEN",
  "GMAIL_CLIENT_ID",
  "GMAIL_CLIENT_SECRET",
  "GMAIL_REFRESH_TOKEN",
  "GMAIL_FROM"
]

[triggers]
crons = ["17 */3 * * *"]

[[d1_databases]]
binding = "CASE_DB"
database_name = "kf001-owner-state"
database_id = "5249d296-0295-46fe-bd7f-f7055fca3f7b"
migrations_dir = "migrations"
