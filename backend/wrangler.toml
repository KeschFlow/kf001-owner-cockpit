name = "kf001-owner-backend"
main = "src/worker-v2.js"
compatibility_date = "2026-08-17"
workers_dev = true

[vars]
PUBLIC_APP_ORIGIN = "https://keschflow.github.io"

[secrets]
required = [
  "OWNER_BOOTSTRAP_TOKEN",
  "RADAR_INGEST_TOKEN",
  "GMAIL_CLIENT_ID",
  "GMAIL_CLIENT_SECRET",
  "GMAIL_REFRESH_TOKEN",
  "GMAIL_FROM"
]

[triggers]
crons = ["17 */3 * * *"]

[[d1_databases]]
binding = "CASE_DB"
database_name = "kf001-owner-state"
database_id = "5249d296-0295-46fe-bd7f-f7055fca3f7b"
migrations_dir = "migrations"
